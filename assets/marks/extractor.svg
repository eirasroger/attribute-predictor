<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a054"/>
      <stop offset="1" stop-color="#a8681a"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdf4e7"/>
    </linearGradient>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6b430d" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect x="18" y="26" width="68" height="98" rx="7" fill="#ffffff" opacity="0.7"
        stroke="#c98226" stroke-opacity="0.22" transform="rotate(-7 52 75)"/>

  <g filter="url(#lift)">
    <rect x="26" y="20" width="70" height="105" rx="7" fill="url(#sheet)"
          stroke="#c98226" stroke-opacity="0.34"/>
  </g>

  <rect x="37" y="33" width="32" height="6" rx="3" fill="#c98226" opacity="0.8"/>
  <g fill="#c98226">
    <rect x="37" y="52" width="48" height="5" rx="2.5" opacity="0.42"/>
    <rect x="37" y="66" width="36" height="5" rx="2.5" opacity="0.28"/>
    <rect x="37" y="80" width="44" height="5" rx="2.5" opacity="0.42"/>
    <rect x="37" y="94" width="28" height="5" rx="2.5" opacity="0.28"/>
    <rect x="37" y="108" width="40" height="5" rx="2.5" opacity="0.42"/>
  </g>

  <g stroke="#c98226" stroke-opacity="0.45" stroke-width="1.3">
    <path d="M96 54 C110 54 110 42 124 42"/>
    <path d="M96 82 C110 82 110 75 124 75"/>
    <path d="M96 110 C110 110 110 108 124 108"/>
  </g>

  <g filter="url(#lift)">
    <rect x="124" y="30" width="58" height="24" rx="6" fill="url(#chip)"/>
    <rect x="124" y="63" width="58" height="24" rx="6" fill="url(#chip)" opacity="0.74"/>
    <rect x="124" y="96" width="58" height="24" rx="6" fill="url(#chip)" opacity="0.52"/>
  </g>
  <g fill="#ffffff" opacity="0.88">
    <rect x="134" y="40" width="24" height="4" rx="2"/>
    <rect x="134" y="73" width="34" height="4" rx="2"/>
    <rect x="134" y="106" width="18" height="4" rx="2"/>
  </g>
